[workspace]
resolver = "2"
members = [
    "crates/locksmith-core",
    "crates/locksmithd",
    "crates/locksmith-cli",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"
description = "Deterministic workspace locking and coordination engine"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
# reqwest intentionally absent: locksmith-cli uses a std-based HTTP client (src/http.rs)

[profile.release]
opt-level = 3
lto = "thin"
